name: Security & CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-ci:
    name: Web Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend-ci:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run Pytest Suite
        run: |
          mkdir -p /tmp/ruangrpp-ci-uploads
          python -m pytest -v services/api/tests/
        env:
          APP_TESTING: '1'
          RAG_ENABLED: 'false'
          DATABASE_URL: 'sqlite:////tmp/ruangrpp-ci.db'
          STORAGE_DIR: '/tmp/ruangrpp-ci-uploads'
          PYTHONPATH: 'services/api'

  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NPM Dependency Audit
        run: |
          cd apps/web
          npm audit --audit-level=critical || true

      - name: Detect Committed Secrets / Keys
        run: |
          echo "Scanning for accidental secret commits..."
          # Reject commits accidentally including raw live private keys or credentials
          ! grep -rn "sk-proj-" . --exclude-dir={.git,node_modules,.next} || exit 1
          ! grep -rn "SB-Mid-server-" . --exclude-dir={.git,node_modules,.next} || exit 1
          ! grep -rn "Mid-server-" . --exclude-dir={.git,node_modules,.next} || exit 1
